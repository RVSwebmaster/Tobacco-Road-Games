name: Publish Owner Intake
run-name: Owner publish ${{ github.event.client_payload.publish_id || github.run_id }}

on:
  repository_dispatch:
    types:
      - owner_publish_intake

permissions:
  contents: write

concurrency:
  group: owner-publish-${{ github.event.client_payload.ref || 'main' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply publish payload
        env:
          OWNER_PUBLISH_EVENT_JSON: ${{ toJson(github.event.client_payload) }}
        run: node scripts/publish-intake.js

      - name: Rebuild storefront
        run: node scripts/build-store.js

      - name: Commit and push
        env:
          TARGET_REF: ${{ github.event.client_payload.ref || 'main' }}
          TARGET_SLUG: ${{ github.event.client_payload.metadata.slug || github.event.client_payload.featuredSlug || 'homepage' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No repo changes were produced by this publish."
            exit 0
          fi
          git add shared/product-folder-map.mjs shared/runtime-catalog.mjs data/product-intake-map.json data/products.json data/homepage.json index.html store authors sitemap.xml
          git commit -m "Publish ${TARGET_SLUG} from owner intake"
          git push origin "HEAD:${TARGET_REF}"
