<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Advertising Operations | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head><body class="view-section"><main class="store-section"><a href="/owner/">Owner Dashboard</a><h1>Advertising Operations</h1><p>Approve creator-supplied ads and maintain bounded house, event, vendor-sponsor, and Preferred creator-notice pools.</p><div id="creative-list"></div><h2>Marketplace ad</h2><form id="ad-form" class="account-form"><label>Pool <select name="pool"><option value="house">TRG house</option><option value="event">TRG event</option><option value="vendor_sponsor">Outside-vendor sponsor</option><option value="preferred_notice">Preferred creator notice</option></select></label><label>Sponsor/vendor name <input name="sponsorName"></label><label>Title <input name="title" required></label><label>Alt text <input name="altText" required></label><label>Creative URL <input name="creativeUrl" required></label><label>Destination URL <input name="destinationUrl" required></label><label>Allocation weight (1–5) <input name="allocationWeight" type="number" min="1" max="5" value="1"></label><label><input name="approved" type="checkbox"> Approved</label><label><input name="active" type="checkbox"> Active</label><button class="button">Save ad</button></form><p id="status"></p></main><script>const csrf=(document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');async function api(body){const r=await fetch('/owner/api/advertising',{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'content-type':'application/json','x-csrf-token':csrf}:{},body:body?JSON.stringify(body):null}),p=await r.json();if(!r.ok)throw Error(p.error||'Request failed');return p}async function load(){const p=await api(),root=document.querySelector('#creative-list');root.replaceChildren(...p.creatives.map(c=>{const x=document.createElement('p');x.textContent=`${c.creator_name} · ${c.product_title} · ${c.validation_state}`;if(c.validation_state==='uploaded'){for(const [label,action] of [['Accept','accept_creative'],['Reject','reject_creative']]){const b=document.createElement('button');b.textContent=label;b.onclick=async()=>{await api({action,creativeId:c.id});load()};x.append(' ',b)}}return x}))}document.querySelector('#ad-form').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,d=Object.fromEntries(new FormData(f));await api({action:'save_marketplace_ad',...d,approvalState:f.approved.checked?'approved':'pending',status:f.active.checked?'active':'draft'});document.querySelector('#status').textContent='Saved.'};load();</script></body></html>
