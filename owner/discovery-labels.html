<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Marketplace Discovery Labels | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head><body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__name">Marketplace Discovery Labels</span></a><nav class="site-nav"><a href="/owner/">Owner Dashboard</a></nav></header><main class="store-section"><p class="section-heading__kicker">Operator only</p><h1>Explainable organic discovery</h1><p>Labels recalculate from current marketplace activity. Removal suppresses a label until restored; there is no manual boost control.</p><button id="recalculate" class="button button--primary">Recalculate labels</button><p id="status" role="status"></p><div id="labels"></div><h2>Recent runs</h2><pre id="runs"></pre></main></div><script>const csrf=(document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');async function mutate(body){const r=await fetch('/owner/api/discovery-labels',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(body)}),p=await r.json();if(!r.ok)throw Error(p.error||'Operation failed.');return p;}async function load(){const r=await fetch('/owner/api/discovery-labels',{credentials:'same-origin'}),p=await r.json();if(!r.ok)throw Error(p.error);const root=document.getElementById('labels');root.replaceChildren(...p.labels.map(x=>{const a=document.createElement('article');a.className='note-card';const h=document.createElement('h2');h.textContent=`${x.subject_type} ${x.subject_id}: ${x.label}`;const reason=document.createElement('p');reason.textContent=`${x.display_reason} Calculated ${x.calculated_at}; expires ${x.expires_at}. Metrics: ${x.metric_snapshot_json}`;const b=document.createElement('button');b.className='button button--secondary';b.textContent='Remove contaminated/manipulated label';b.onclick=()=>mutate({action:'remove',subjectType:x.subject_type,subjectId:x.subject_id,label:x.label,reasonCode:'test_contamination',reasonNotes:'Operator review required.'}).then(load);a.append(h,reason,b);return a;}));document.getElementById('runs').textContent=JSON.stringify(p.runs,null,2);document.getElementById('status').textContent=`${p.labels.length} calculated label records.`;}document.getElementById('recalculate').onclick=()=>mutate({action:'recalculate',runKey:`manual:${new Date().toISOString()}`}).then(load).catch(e=>document.getElementById('status').textContent=e.message);load().catch(e=>document.getElementById('status').textContent=e.message);</script></body></html>
