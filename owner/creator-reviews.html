<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Creator Publication Queue | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head><body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__name">Creator Publication Queue</span></a><nav class="site-nav"><a href="/owner/">Owner Dashboard</a></nav></header><main class="store-section"><div class="section-heading"><p class="section-heading__kicker">Operator only</p><h1>Creator Listing Reviews and Publication</h1><p>Approval and publication are separate actions. Publication remains blocked until required fields and accepted private files are ready.</p></div><div id="review-queue" class="product-card-grid"></div><p id="review-status" role="status">Loading…</p></main></div><script>
const csrf=(document.cookie.split(';').map(value=>value.trim()).find(value=>value.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');
async function mutate(path,body){const response=await fetch(path,{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(body)});const payload=await response.json();if(!response.ok)throw new Error(payload.error||payload.validationErrors?.join(' ')||'Operation failed.');return payload;}
async function load(){const response=await fetch('/owner/api/creator-reviews',{credentials:'same-origin'}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Queue unavailable.');const root=document.getElementById('review-queue');root.replaceChildren(...payload.listings.map(item=>{const card=document.createElement('article');card.className='product-card';const body=document.createElement('div');body.className='product-card__body';const heading=document.createElement('h2');heading.textContent=item.title;const meta=document.createElement('p');meta.textContent=`${item.creator_name} · review ${item.lifecycle_state} · publication ${item.publication_state} · target ${item.public_product_slug||item.slug} · ${Number.isInteger(item.listed_price_cents)?'$'+(item.listed_price_cents/100).toFixed(2):'price missing'} · delivery ${item.media_type==='physical'?'physical review required':item.accepted_files?'file staged':'file missing'}`;body.append(heading,meta);const errors=JSON.parse(item.publication_errors_json||'[]');if(errors.length){const error=document.createElement('p');error.textContent=`Validation: ${errors.join(' ')}`;body.append(error);}for(const file of (payload.files||[]).filter(value=>value.listing_id===item.id)){const row=document.createElement('p');row.textContent=`${file.purpose}: ${file.normalized_filename} — ${file.validation_state}${file.validation_message?' — '+file.validation_message:''}`;body.append(row);if(['uploaded','validating'].includes(file.validation_state))body.append(button('Accept File',()=>mutate('/owner/api/creator-publication',{fileId:file.id,action:'accept_file'})),button('Reject File',()=>mutate('/owner/api/creator-publication',{fileId:file.id,action:'reject_file',message:'Operator rejected this file.'})));}if(item.lifecycle_state==='submitted'){body.append(button('Approve',()=>mutate('/owner/api/creator-reviews',{listingId:item.id,action:'approve'})),button('Request Changes',()=>mutate('/owner/api/creator-reviews',{listingId:item.id,action:'request_changes'})));}if(['approved','waiting_for_files','failed'].includes(item.publication_state))body.append(button('Validate and Publish',()=>mutate('/owner/api/creator-publication',{listingId:item.id,action:'publish'}));if(item.publication_state==='published')body.append(button('Pause Publication',()=>mutate('/owner/api/creator-publication',{listingId:item.id,action:'pause_publication'}));card.append(body);return card;}));document.getElementById('review-status').textContent=`${payload.listings.length} creator listing${payload.listings.length===1?'':'s'} in review or publication state.`;}
function button(label,action){const value=document.createElement('button');value.className='button button--secondary';value.textContent=label;value.onclick=async()=>{try{const result=await action();document.getElementById('review-status').textContent=result.error||'Operation completed.';await load();}catch(error){document.getElementById('review-status').textContent=error.message;}};return value;}load().catch(error=>{document.getElementById('review-status').textContent=error.message;});
</script></body></html>
