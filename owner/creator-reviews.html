<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Creator Listing Reviews | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head><body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__name">Operator Review Queue</span></a><nav class="site-nav"><a href="/owner/">Owner Dashboard</a></nav></header><main class="store-section"><div class="section-heading"><p class="section-heading__kicker">Operator only</p><h1>Creator Listing Reviews</h1><p>Submitted creator drafts awaiting validation and publication decisions.</p></div><div id="review-queue" class="product-card-grid"></div><p id="review-status" role="status">Loading…</p></main></div><script>
fetch('/owner/api/creator-reviews',{credentials:'same-origin'}).then(async response=>({ok:response.ok,payload:await response.json()})).then(({ok,payload})=>{if(!ok)throw new Error(payload.error||'Queue unavailable.');const root=document.getElementById('review-queue');for(const item of payload.listings){const card=document.createElement('article');card.className='product-card';const body=document.createElement('div');body.className='product-card__body';const heading=document.createElement('h2');heading.textContent=item.title;const meta=document.createElement('p');meta.textContent=`${item.creator_name} · ${item.lifecycle_state}`;body.append(heading,meta);card.append(body);root.append(card);}document.getElementById('review-status').textContent=`${payload.listings.length} listing${payload.listings.length===1?'':'s'} awaiting action. Approve/request-change mutations use the protected owner API.`;}).catch(error=>{document.getElementById('review-status').textContent=error.message;});
</script></body></html>
