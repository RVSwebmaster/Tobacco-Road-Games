<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Creator Finance | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head><body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__name">Creator Finance</span></a><nav class="site-nav"><a href="/owner/">Owner Dashboard</a></nav></header><main class="store-section"><div class="section-heading"><p class="section-heading__kicker">Operator only</p><h1>Creator Balances and Payout Readiness</h1><p>No external payouts are initiated here. Record a payout only after confirming the external transfer.</p></div><p id="finance-summary" role="status">Loading…</p><div id="finance-list" class="product-card-grid"></div><h2>Ledger Reconciliation</h2><pre id="finance-exceptions"></pre><h2>Stripe Provider Reconciliation</h2><pre id="provider-exceptions"></pre></main></div><script>
const csrf=(document.cookie.split(';').map(value=>value.trim()).find(value=>value.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');const money=value=>`$${(Number(value||0)/100).toFixed(2)}`;
async function load(){const response=await fetch('/owner/api/creator-finance',{credentials:'same-origin'}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Finance data unavailable.');document.getElementById('finance-summary').textContent=`TRG-owned product revenue ${money(payload.houseRevenueCents)} · ${payload.readiness.filter(item=>item.eligible).length} creators payout-ready`;document.getElementById('finance-exceptions').textContent=show(payload.reconciliation);document.getElementById('provider-exceptions').textContent=show(payload.providerReconciliation);const readiness=new Map(payload.readiness.map(item=>[item.id,item]));document.getElementById('finance-list').replaceChildren(...payload.balances.map(item=>card(item,readiness.get(item.id))));}
function card(item,ready){const card=document.createElement('article');card.className='product-card';const body=document.createElement('div');body.className='product-card__body';const title=document.createElement('h2');title.textContent=item.display_name;const totals=document.createElement('p');totals.textContent=`Gross ${money(item.grossSalesCents)} · fees ${money(item.marketplaceFeesCents)} · unpaid ${money(item.unpaidBalanceCents)} · available ${money(item.availableBalanceCents)} · held ${money(ready?.providerHeldCents||item.onHoldCents)} · paid ${money(item.paidBalanceCents)}`;const state=document.createElement('p');state.textContent=ready?.eligible?`Eligible for payout: ${money(ready.eligibleAmountCents)}.`:`Blocked: ${(ready?.blockedReasons||['Status unavailable.']).join(' ')}`;const profile=document.createElement('p');profile.textContent=`Provider ${ready?.profile?.provider||'manual'} · onboarding ${ready?.profile?.onboarding_status||'not started'} · verification ${ready?.profile?.verification_status||'unverified'} · payouts ${ready?.profile?.payouts_enabled?'enabled':'disabled'}${item.lastPayout?` · last payout ${item.lastPayout.paid_at}`:''}`;body.append(title,totals,state,profile);if(ready?.eligible)body.append(payoutForm(item));card.append(body);return card;}
function payoutForm(item){const form=document.createElement('form');form.className='account-form';form.innerHTML='<label>Amount in cents <input name="amount" type="number" min="1" required></label><label>External transfer reference <input name="reference" required maxlength="200"></label><label>Non-sensitive note <input name="note" maxlength="1000" autocomplete="off"></label><button class="button button--secondary">Record Completed Manual Payout</button>';form.onsubmit=async event=>{event.preventDefault();const data=new FormData(form);await mutate({action:'record_payout',creatorId:item.id,amountCents:Number(data.get('amount')),currency:'USD',reference:data.get('reference'),note:data.get('note'),idempotencyKey:crypto.randomUUID()});await load();};return form;}
async function mutate(body){const response=await fetch('/owner/api/creator-finance',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(body)}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Finance action failed.');return payload;}function show(items){return items?.length?JSON.stringify(items,null,2):'No exceptions detected.';}load().catch(error=>document.getElementById('finance-summary').textContent=error.message);
</script></body></html>
