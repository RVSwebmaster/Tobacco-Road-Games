<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payout Batches | Tobacco Road Games</title><link rel="stylesheet" href="/styles.css"></head>
<body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__name">Payout Batches</span></a><nav class="site-nav"><a href="/owner/creator-finance.html">Creator Finance</a></nav></header>
<main class="store-section"><div class="section-heading"><p class="section-heading__kicker">Operator only</p><h1>Prepare and Review Payout Batches</h1><p>Preparation and approval do not move money or mark ledger earnings paid. External execution is disabled in Pass 9.</p></div>
<p><button id="reconcile" class="button button--secondary" type="button">Check Stripe Sandbox Status</button> <button id="prepare" class="button button--secondary" type="button">Prepare USD Batch</button></p><p id="status" role="status"></p><pre id="exceptions">No account check run.</pre><div id="batches" class="product-card-grid"></div></main></div>
<script>
const csrf=(document.cookie.split(';').map(value=>value.trim()).find(value=>value.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');
async function mutate(body){const response=await fetch('/owner/api/creator-finance',{method:'POST',credentials:'same-origin',headers:{'content-type':'application/json','x-csrf-token':csrf},body:JSON.stringify(body)}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Finance action failed.');return payload;}
async function load(){const response=await fetch('/owner/api/creator-finance',{credentials:'same-origin'}),payload=await response.json();if(!response.ok)throw new Error(payload.error||'Finance data unavailable.');document.getElementById('batches').replaceChildren(...(payload.payoutBatches||[]).map(card));document.getElementById('status').textContent=`${payload.readiness.filter(item=>item.eligible).length} creators currently meet provider and TRG requirements.`;}
function card(batch){const article=document.createElement('article');article.className='product-card';const body=document.createElement('div');body.className='product-card__body';const title=document.createElement('h2');title.textContent=`${batch.currency} · ${batch.status}`;const detail=document.createElement('p');detail.textContent=`Prepared ${batch.prepared_at} by ${batch.prepared_by}`;body.append(title,detail);if(batch.status==='ready_for_review'){const button=document.createElement('button');button.className='button button--secondary';button.type='button';button.textContent='Approve (No Money Moves)';button.onclick=async()=>{await mutate({action:'approve_payout_batch',batchId:batch.id});await load();};body.append(button);}article.append(body);return article;}
document.getElementById('reconcile').onclick=async()=>{try{const result=await mutate({action:'connect_reconcile'});document.getElementById('exceptions').textContent=result.exceptions.length?JSON.stringify(result.exceptions,null,2):'No Connect account exceptions detected.';}catch(error){document.getElementById('exceptions').textContent=error.message;}};
document.getElementById('prepare').onclick=async()=>{try{await mutate({action:'prepare_payout_batch',currency:'USD'});await load();}catch(error){document.getElementById('status').textContent=error.message;}};load().catch(error=>document.getElementById('status').textContent=error.message);
</script></body></html>
