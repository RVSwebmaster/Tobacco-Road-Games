<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Product Inactivity | Tobacco Road Games</title><link rel="stylesheet" href="../styles.css?v=20260604e"></head>
<body class="view-section"><div class="page-shell"><header class="site-header"><a class="brand" href="/owner/"><span class="brand__copy"><span class="brand__name">Product Inactivity</span><span class="brand__tag">Marketplace lifecycle operations</span></span></a><nav class="site-nav"><a href="/owner/">Dashboard</a><a href="/owner/logout">Log Out</a></nav></header>
<main><section class="store-section"><div class="section-heading"><p class="section-heading__kicker">Rolling 12-month policy</p><h1>Inactivity operations</h1><p>Review products approaching or completing their 30-day grace period. Running the check is safe to repeat.</p></div><button class="button button--secondary" id="run-check">Run inactivity check</button><p id="status" aria-live="polite"></p><div id="groups"></div></section></main></div>
<script>
const status=document.querySelector('#status'),groups=document.querySelector('#groups'),csrf=(document.cookie.split(';').map(value=>value.trim()).find(value=>value.startsWith('trg_owner_csrf='))||'').split('=').slice(1).join('=');
async function request(method='GET',body){const response=await fetch('/owner/api/creator-finance',{method,credentials:'same-origin',headers:{accept:'application/json','content-type':'application/json','x-csrf-token':csrf},body:body?JSON.stringify(body):undefined,cache:'no-store'}),payload=await response.json();if(!response.ok)throw new Error(payload.error?.message||payload.error||'Request failed.');return payload;}
function row(item,dateKey){const article=document.createElement('article');article.className='product-card';const body=document.createElement('div');body.className='product-card__body';const heading=document.createElement('h3');heading.textContent=item.title;const detail=document.createElement('p');detail.textContent=`Creator ${item.creator_id} · Listing ${item.id} · ${item[dateKey]?new Date(item[dateKey]).toLocaleString():'date unavailable'}`;body.append(heading,detail);article.append(body);return article;}
function section(title,items,dateKey){const section=document.createElement('section'),heading=document.createElement('h2');heading.textContent=`${title} (${items.length})`;section.append(heading,...(items.length?items.map(item=>row(item,dateKey)):[Object.assign(document.createElement('p'),{textContent:'None.'})]));return section;}
async function load(){const payload=await request(),data=payload.inactivity||{};groups.replaceChildren(section('Warnings',data.warnings||[],'inactivity_grace_ends_at'),section('Recently inactive',data.recentInactive||[],'inactivity_transitioned_at'),section('Recently reactivated',data.recentReactivated||[],'inactivity_reactivated_at'),section('Lifecycle errors',data.lifecycleErrors||[],'created_at'));}
document.querySelector('#run-check').onclick=async()=>{try{status.textContent='Running…';const payload=await request('POST',{action:'run_inactivity_check'});status.textContent=`Checked ${payload.result.checked}; warned ${payload.result.warnings}; paused ${payload.result.inactivated}; errors ${payload.result.errors.length}.`;await load();}catch(error){status.textContent=error.message;}};load().catch(error=>{status.textContent=error.message;});
</script></body></html>
