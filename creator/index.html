<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Creator Dashboard | Tobacco Road Games</title>
    <link rel="stylesheet" href="/styles.css?v=5097271" />
    <link rel="stylesheet" href="/assets/css/creator-dashboard.css?v=open-rules-hover1" />
    <script src="/assets/js/storefront.js?v=20261112-rendered-spines5" defer></script>
    <script src="/assets/js/homepage-shelves.js?v=creator-open-rules2" defer></script>
    <script src="/assets/js/creator-open-rules.js?v=13-books1" defer></script>
    <script src="/assets/js/creator-dashboard-blank.js?v=727f0ef" defer></script>
  </head>
  <body class="view-section creator-workspace-page">
    <div class="page-shell">
      <header class="site-header">
        <a class="brand" href="/creator/">
          <img class="brand__logo" src="/assets/tobacco-road-games-logo.png" alt="" />
          <span class="brand__name">Tobacco Road Games</span>
        </a>
        <nav class="site-nav" aria-label="Creator Dashboard menu">
          <span class="creator-menu-placeholder">Menu</span>
        </nav>
      </header>
      <main class="homepage-shop-wall creator-dashboard-shop-wall" id="creator-dashboard">
        <h1 class="creator-dashboard-visually-hidden">Creator Dashboard</h1>
        <section class="shop-wall-row shop-wall-row--identity" aria-label="Empty Tobacco Road Games Creator workspace">
          <section class="shop-wall-bay shop-wall-bay--library" aria-label="Empty left shelf bay">
            <div class="shop-wall-shelves shop-wall-shelves--library" aria-label="Empty left shelves">
              <div class="shop-wall-shelf-level shop-wall-shelf-level--upper">
                <div class="shop-wall-product-row shop-wall-product-row--library" aria-hidden="true"></div>
              </div>
              <div class="shop-wall-shelf-level shop-wall-shelf-level--lower">
                <div class="shop-wall-product-row shop-wall-product-row--library" aria-hidden="true"></div>
              </div>
            </div>
          </section>
          <section class="shop-wall-bay shop-wall-bay--identity" aria-label="Tobacco Road Games emblem panel">
            <div class="shop-wall-identity-sign" aria-label="Tobacco Road Games and Creator identities">
              <img class="creator-dashboard-brand-mark" src="/assets/tobacco-road-games-logo.png" alt="" loading="eager" decoding="async" />
              <div id="creator-identity" class="creator-dashboard-creator-identity" hidden>
                <img class="creator-dashboard-creator-image" alt="" loading="eager" decoding="async" hidden />
                <span class="creator-dashboard-creator-initials" hidden aria-hidden="true"></span>
                <span class="creator-dashboard-creator-name"></span>
              </div>
            </div>
          </section>
          <section class="shop-wall-bay shop-wall-bay--products creator-dashboard-open-rules-bay" aria-labelledby="open-rules-library-heading">
            <h2 class="shop-wall-heading-hidden" id="open-rules-library-heading">OPEN RULES LIBRARY</h2>
            <div class="shop-wall-shelves shop-wall-shelves--library" aria-label="OPEN RULES LIBRARY shelves">
              <div class="shop-wall-shelf-level shop-wall-shelf-level--upper">
                <div class="shop-wall-product-row shop-wall-product-row--library">
                  <div class="shop-wall-library-books" data-creator-open-rules-books></div>
                </div>
              </div>
              <div class="shop-wall-shelf-level shop-wall-shelf-level--lower">
                <div class="shop-wall-product-row shop-wall-product-row--library">
                  <div class="shop-wall-library-books" data-creator-open-rules-books></div>
                </div>
              </div>
            </div>
          </section>
          <span class="shop-wall-shelf-fixtures" aria-hidden="true"><span></span><span></span><span></span></span>
        </section>
        <p id="creator-status" class="creator-dashboard-visually-hidden" role="status">Checking Creator session…</p>
      </main>
      <footer class="site-footer creator-dashboard-footer">
        <p><a href="/temp-creator/">Open preserved Creator Dashboard</a></p>
      </footer>
    </div>
  </body>
</html>
