# Local Owner workbench template. The launcher copies this file to the repository
# root temporarily because Wrangler Pages resolves Functions and static assets
# from that location. Never deploy this configuration.
name = "tobacco-road-games-staging"
pages_build_output_dir = "."
compatibility_date = "2026-06-18"

[vars]
PAYMENT_PIPELINE_STAGE = "staging"
STAGING_CHECKOUT_PRODUCT_SLUG = "agency"
PUBLIC_SITE_ORIGIN = "http://127.0.0.1:8788"
RESEND_DELIVERY_ENABLED = "false"
LOCAL_OWNER_BYPASS = "1"
OFFICE_UPLOAD_RESERVATION_TTL_SECONDS = "600"
OFFICE_MAX_FILE_BYTES = "94371840"
OFFICE_MAX_BATCH_FILES = "50"
OFFICE_MAX_BATCH_BYTES = "1073741824"

[[d1_databases]]
binding = "TRG_ORDERS"
database_name = "trg-orders-staging"
database_id = "d92594e8-a45c-4f84-8f48-7c3aeba17f29"
migrations_dir = "migrations"
remote = true

[[r2_buckets]]
binding = "TRG_PRODUCTS"
bucket_name = "trg-products-staging"
remote = true

[[r2_buckets]]
binding = "TRG_FORUM_AVATARS"
bucket_name = "trg-forum-avatars-staging"
remote = true

[[d1_databases]]
binding = "TRG_OFFICE"
database_name = "trg-office-staging"
database_id = "4c3ae60a-da41-4d65-aee5-a53179fc53f8"
migrations_dir = "office-migrations"
remote = true

[[r2_buckets]]
binding = "TRG_OFFICE_ARCHIVE"
bucket_name = "trg-office-archive-staging"
remote = true
